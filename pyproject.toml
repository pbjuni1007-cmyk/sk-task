[tool.ruff]
required-version = "==0.16.1"
target-version = "py312"
line-length = 100
extend-exclude = ["runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# CLI 스크립트는 앱을 가져오기 전에 저장소 루트를 sys.path에 추가한다.
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
